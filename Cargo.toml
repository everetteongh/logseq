[workspace]
members = ["bindings/*"]

[workspace.package]
version = "0.1.6"
authors = ["stel <stel@national.shitposting.agency>"]
edition = "2024"
description = "Opinionated Logseq graph handling in Rust"
keywords = ["logseq", "markdown", "markdown-parser", "logseq-graph"]
homepage = "https://github.com/everetteongh/logseq"
repository = "https://codeberg.org/everette/logseq"
readme = "README.md"
license = "0BSD"

[workspace.dependencies]
time = { version = "0.3.54", features = ["formatting", "macros", "parsing", "local-offset"] }
pyo3 = "0.29.0"

[workspace.lints.rust]
missing_docs = { level = "warn", priority = -1 }

[workspace.lints.clippy]
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_docs_in_private_items = { level = "warn", priority = -1 }

[package]
name = "logseq"
exclude = [
    "/.cargo/",
    "/assets/",
    "/bindings/"
]
version.workspace = true
authors.workspace = true
edition.workspace = true
description.workspace = true
keywords.workspace = true
homepage.workspace = true
repository.workspace = true
readme.workspace = true
license.workspace = true

[lib]
doctest = false

[lints]
workspace = true

[features]
default = ["regex-lite"]
# use the [regex-lite](https://lib.rs/crates/regex-lite) crate as the regular expression backend; otherwise, use [regex](https://lib.rs/crates/regex) (**enabled by default**)
regex-lite = ["dep:regex-lite"]
# enable support for [serde](https://serde.rs) serialization & deserialization of certain types
serde = ["dep:serde", "time/serde"]
# enable python-compat code (you'll probably never need to enable this yourself)
python = ["dep:pyo3"]
# provides [icalendar](https://lib.rs/crates/icalendar) type conversion for block views
icalendar = ["dep:icalendar", "dep:chrono"]

[dependencies]
comrak = { version = "0.54.0", default-features = false }
chrono = { version = "0.4.0", optional = true }
humantime = "2.4.0"
icalendar = { version = "0.17.0", optional = true }
indexmap = "2.14.0"
pyo3 = { workspace = true, optional = true }
regex = { version = "1.13.0", optional = true }
regex-lite = { version = "0.1.0", optional = true }
rustc-hash = "2.1.0"
serde = { version = "1.0.0", features = ["derive"], optional = true }
thiserror = "2.0.0"
time = { workspace = true }
uuid = { version = "1.24.0", features = ["v4"] }
walkdir = "2.5.0"
